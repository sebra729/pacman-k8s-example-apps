apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    name: pacman
  name: pacman
spec:
  replicas: 1
  selector:
    matchLabels:
      name: pacman
  template:
    metadata:
      labels:
        name: pacman
    spec:
      containers:
      - image: quay.io/sebra729/erubium_pacman_v2:latest
        name: pacman
        ports:
        - containerPort: 8080
          name: http-server
        env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://grafana-k8s-monitoring-alloy-receiver.default.svc.cluster.local:4317"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "grpc"
            - name: OTEL_SERVICE_NAME
              value: "pacman"
            - name: OTEL_NODE_RESOURCE_DETECTORS
              value: "all"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "deployment.environment=pacman-prod, deployment_environment=pacman-prod, service_name=pacman, service.name=pacman"


